name: Automated Book Scraper & EDA Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch:     # Allows manual trigger from the GitHub Actions UI tab

permissions:
  contents: write        # Grants permission to commit files back to repository

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute scraping and EDA script
        run: python scraper.py

      - name: Commit and push updated dataset and charts
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'action@github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-update data and EDA charts: $(date +'%Y-%m-%d')" && git push)
